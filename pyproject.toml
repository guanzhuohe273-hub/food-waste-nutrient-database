[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-waste-evidence-agent"
version = "1.0.0"
description = "Evidence-grounded hybrid agent for querying a verified food-waste nutrient database."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["streamlit>=1.36", "openai>=1.0", "pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
